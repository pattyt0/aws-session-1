name: Deploy to AWS
on:
  push:
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch and Decode OIDC Token
        run: |
          # 1. Request the token from GitHub's provider
          JWT=$(curl -s "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          
          # 2. Decode the payload section (second part of JWT)
          PAYLOAD=$(echo "$JWT" | cut -d'.' -f2 | base64 --decode 2>/dev/null)
          
          # 3. Extract and print the 'sub' claim
          echo "Your OIDC 'sub' claim is:"
          echo "$PAYLOAD" | jq -r '.sub'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/githubconnect
          aws-region: us-east-1
      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cf-template.yaml \
            --stack-name pm-ec2-demo \
            --no-fail-on-empty-changeset